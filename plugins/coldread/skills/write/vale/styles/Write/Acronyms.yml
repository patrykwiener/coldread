extends: conditional
message: "Spell out '%s' at first use, unless the reader uses it daily."
level: warning
first: '\b([A-Z]{3,5})\b'
second: '(?:\b[A-Z][a-z]+ )+\(([A-Z]{3,5})\)'
exceptions:
  - 'API'
  - 'HTTP'
  - 'HTTPS'
  - 'JSON'
  - 'YAML'
  - 'HTML'
